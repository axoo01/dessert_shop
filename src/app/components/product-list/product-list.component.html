<div class="search-wrapper">
  <input type="text" [formControl]="searchControl" placeholder="Search for a dessert..." class="search-input">
</div>

<div class="product-grid">
  @for (item of (products$ | async); track item.name) {
  <app-product-item [product]="item"></app-product-item>
  } @empty {
  <div class="no-results">
    <p>No desserts match "{{ searchControl.value }}".</p>
  </div>
  }
</div>
